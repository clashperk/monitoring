apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoria-metrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: $VM_USER
    secureJsonData:
      basicAuthPassword: $VM_PASSWORD
    jsonData:
      prometheusType: Prometheus
      timeInterval: 30s
